  deskripsi_singkat: Kabupaten {{nama_kota}} adalah pusat pertumbuhan ekonomi dan
    pariwisata di Sulawesi Selatan, berbatasan langsung dengan Makassar.
  overview: Kabupaten {{nama_kota}} (luas 1.883 km², populasi ~765.000 jiwa, 18 kecamatan
    & 167 kelurahan/desa) merupakan daerah strategis yang menyatu dengan Makassar.
    Perekonomian {{nama_kota}} ditopang oleh sektor perdagangan (Pasar Sentral Sungguminasa),
    agrowisata (kopi arabika Malino), dan properti yang tumbuh pesat.
  tentang_kota_1:
  - judul: Sejarah & Warisan Kerajaan {{nama_kota}}
    icon: bi-clock-history
    subjudul: Dari 'Ayam Jantan dari Timur' hingga Pusat Niaga Modern
    icon_subjudul: bi-book
    deskripsi: Kabupaten {{nama_kota}} memiliki sejarah panjang sebagai pusat Kerajaan
      {{nama_kota}} yang legendaris. Di bawah kepemimpinan Sultan Hasanuddin (1629-1670)
      yang dijuluki 'Ayam Jantan dari Timur', {{nama_kota}} mencapai puncak kejayaannya
      sebagai pusat perdagangan rempah-rempah dan kekuatan maritim terbesar di Indonesia
      Timur. Warisan kerajaan masih terasa kuat di {{nama_kota}} modern — rumah adat,
      tradisi budaya, dan nilai kebersamaan masih dijunjung. Situs-situs bersejarah
      seperti Makam Raja-Raja {{nama_kota}} dan Masjid Tua Katangka di Kelurahan Katangka,
      Somba Opu, menjadi sakbis perjalanan panjang {{nama_kota}} dari masa kejayaan
      menuju era modern.
    fakta:
    - Kerajaan {{nama_kota}} menguasai jalur perdagangan rempah Indonesia Timur pada
      abad ke-16 hingga ke-17
    - Benteng Fort Rotterdam di Makassar adalah saksi bisu perlawanan Sultan Hasanuddin
      melawan VOC Belanda
    - Bahasa Makassar (Mangkasara') masih aktif digunakan sehari-hari oleh masyarakat
      {{nama_kota}}
  - judul: Ekonomi & Potensi Agrowisata {{nama_kota}}
    icon: bi-shop
    subjudul: Kopi Arabika Malino hingga Pasar Rakyat Sungguminasa
    icon_subjudul: bi-graph-up
    deskripsi: Perekonomian {{nama_kota}} didorong oleh sektor perdagangan dan pertanian
      yang kuat. Pasar Sentral Sungguminasa menjadi pusat transaksi kayu Dolken, hasil
      bumi, dan barang kebutuhan pokok terbesar di kawasan timur Sulawesi Selatan.
      Sektor pertanian menjadi andalan dengan kopi arabika Malino yang mendunia —
      ditanam di ketinggian 1.000+ mdpl dengan cita rasa unik. Sektor properti di
      {{nama_kota}} juga tumbuh fantastis, dengan banyak perumahan baru di Sungguminasa,
      Pallangga, dan Somba Opu yang menjadi penyangga permukiman Makassar. Pertumbuhan
      ekonomi {{nama_kota}} menempatkannya sebagai salah satu daerah dengan investasi
      terbesar di Sulsel.
    fakta:
    - Kopi arabika Malino menempati peringkat pertama produksi kopi di Sulawesi Selatan
    - Pasar Sentral Sungguminasa adalah pusat perdagangan kayu Dolken terbesar di
      Sulsel
    - Pertumbuhan properti {{nama_kota}} 2x lipat rata-rata Sulsel didorong harga
      tanah lebih murah
  tentang_kota_2:
  - judul: Destinasi Wisata & Landmark Ikonik
    icon: bi-pin-map
    subjudul: Malino Highlands, Bili-Bili Dam & Islamic Center
    icon_subjudul: bi-star
    deskripsi: "{{nama_kota}} memiliki destinasi wisata pegunungan terpopuler di Sulawesi
      Selatan — Malino Highlands. Hamparan kebun teh, hutan pinus, dan udara sejuk
      (15-25°C) menjadikannya tujuan favorit keluarga. Bili-Bili Dam menjadi ikon
      infrastruktur dengan waduk luas dan pemandangan perbukitan. Islamic Center {{nama_kota}}
      dengan arsitektur megah adalah landmark spiritual dan edukasi di Sungguminasa."
    list_item:
    - "<strong>Malino Highlands</strong> — Destinasi wisata pegunungan dengan kebun
      teh, pinus, dan udara sejuk — favorit wisatawan dari Makassar & sekitarnya"
    - "<strong>Bili-Bili Dam</strong> — Bendungan raksasa dengan waduk indah, cocok
      untuk foto, piknik, dan menikmati matahari terbenam"
    - "<strong>Islamic Center {{nama_kota}}</strong> — Pusat keagamaan megah di Sungguminasa
      dengan arsitektur Islam modern yang menawan"
    - "<strong>Alun-Alun Sungguminasa</strong> — Ruang terbuka hijau pusat kota yang
      ramai setiap akhir pekan"
  - judul: Kuliner Khas & Pusat Oleh-Oleh
    icon: bi-cup
    subjudul: Kopi Malino, Pisang Epe & Oleh-Oleh {{nama_kota}}
    icon_subjudul: bi-star
    deskripsi: Kuliner {{nama_kota}} menawarkan cita rasa autentik Sulawesi Selatan.
      Kopi arabika Malino menjadi primadona dengan cita rasa fruity dan acidity rendah,
      ditanam di dataran tinggi dingin Malino. Pisang Epe {{nama_kota}} — pisang bakar
      khas yang mudah ditemukan di sepanjang poros {{nama_kota}}-Makassar — menjadi
      camilan favorit wisatawan.
    list_item:
    - "<strong>Kopi Arabika Malino</strong> — Kopi specialty khas dataran tinggi Malino,
      ditanam di ketinggian 1.000+ mdpl, cita rasa unik"
    - "<strong>Pisang Epe {{nama_kota}}</strong> — Pisang bakar legit khas Sulawesi,
      mudah ditemukan di {{nama_kota}}-Makassar"
    - "<strong>Oleh-Oleh Pasar Sentral</strong> — Pusat oleh-oleh khas {{nama_kota}}
      di Pasar Sentral Sungguminasa"
    info_tambahan: Pusat oleh-oleh dan kuliner khas {{nama_kota}} terkonsentrasi di
      sepanjang poros Sungguminasa-Malino dan Pasar Sentral Sungguminasa.
